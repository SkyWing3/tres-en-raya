# Integración continua: compila el proyecto y ejecuta las pruebas unitarias en
# Linux, macOS y Windows cada vez que se sube código a main o se abre un pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          modules: 'qtquick3d qtshadertools'
          cache: true

      - name: Instalar dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libvulkan-dev

      - name: Instalar Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Preparar el compilador de Visual Studio
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configurar
        run: cmake --preset debug

      - name: Compilar (aplicación y pruebas)
        run: cmake --build --preset debug

      - name: Ejecutar las pruebas unitarias
        run: ctest --preset debug

      # Las suites generadas por IA se conservan tal como se entregaron (una de sus
      # pruebas es defectuosa), así que su resultado es informativo.
      - name: Ejecutar las pruebas generadas por IA (informativo)
        continue-on-error: true
        run: ctest --preset ia
